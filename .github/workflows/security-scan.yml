name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  dependency-and-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run lint and dependency tasks
        run: ./gradlew :ExpressCheckoutSdk:lint :ExpressCheckoutSdk:dependencies

      - name: Security reminder
        run: |
          echo "Add SAST/DAST and secret scanning integrations for production readiness."
